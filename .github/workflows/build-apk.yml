name: Build GeoMetal PI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer Cython==0.29.36

      - name: Compiler le fichier APK
        run: |
          yes | buildozer android debug

      - name: Récupérer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoMetal-PI-APK
          path: bin/*.apk
          if-no-files-found: error
